on:
  workflow_call:
    inputs:
      payload: { type: string, required: true }
permissions:
  issues: write
jobs:
  issue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      P: ${{ inputs.payload }}
    steps:
      - run: |
          T=$(jq -r '.template // "Ukendt fejl"' <<< "$P")
          M=$(jq -r '.message // ""' <<< "$P")
          X=$(jq -r '.exception // ""' <<< "$P")
          APP=$(jq -r '.app // ""' <<< "$P")
          URL=$(jq -r '.seqUrl // ""' <<< "$P")
          # Fingerprint på template + første linje af exception (typen), ikke hele stacktracen
          FP=$(printf '%s|%s' "$T" "$(head -n1 <<< "$X")" | sha1sum | cut -c1-8)
          gh label create seq-error --color B60205 2>/dev/null || true
          N=$(gh issue list --label seq-error --state open \
                --search "$FP in:title" --json number -q '.[0].number')
          {
            echo "**App:** $APP"
            echo
            echo "**Besked:** $M"
            echo
            echo "**Template:** \`$T\`"
            echo
            echo "**Stacktrace:**"
            echo '```'
            printf '%s\n' "${X:0:60000}"
            echo '```'
            echo
            echo "[Åbn i Seq]($URL)"
          } > body.md
          if [ -n "$N" ]; then
            gh issue comment "$N" --body-file body.md
          else
            gh issue create --label seq-error \
              --title "[$FP] $APP: ${T:0:80}" --body-file body.md
          fi
