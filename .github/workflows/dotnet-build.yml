name: .NET build and test

on:
  workflow_call:
    inputs:
      solution:
        description: Solution or project file to build
        type: string
        required: true
      dotnet-version:
        type: string
        default: '8.0.x'
      configuration:
        type: string
        default: Release

jobs:
  build:
    name: Build ${{ inputs.solution }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        run: dotnet build ${{ inputs.solution }} --no-restore --configuration ${{ inputs.configuration }}

      - name: Test
        run: dotnet test ${{ inputs.solution }} --no-build --configuration ${{ inputs.configuration }} --verbosity normal
