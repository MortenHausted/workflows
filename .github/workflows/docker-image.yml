name: Docker image

on:
  workflow_call:
    inputs:
      name:
        description: Image name (without registry and prefix)
        type: string
        required: true
      context:
        type: string
        required: true
      dockerfile:
        type: string
        required: true
      push:
        description: Push the image to the registry
        type: boolean
        default: false
      registry:
        description: Registry host, e.g. registry.example.com
        type: string
        required: true
      image-prefix:
        description: Repository path between registry and image name
        type: string
        required: true
    secrets:
      registry-username:
        required: false
      registry-password:
        required: false

jobs:
  image:
    name: ${{ inputs.push && 'Build and push' || 'Build' }} ${{ inputs.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ${{ inputs.registry }}
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-prefix }}/${{ inputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ inputs.push }}
            type=raw,value=ci,enable=${{ !inputs.push }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ inputs.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}
